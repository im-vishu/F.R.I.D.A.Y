services:
  postgres:
    image: postgres:16
    container_name: friday-postgres
    restart: always
    environment:
      POSTGRES_USER: friday
      POSTGRES_PASSWORD: friday_password
      POSTGRES_DB: friday_db
    ports:
      - "5433:5432"
    volumes:
      - friday_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: friday-redis
    restart: always
    ports:
      - "6380:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: friday-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - friday_qdrant_data:/qdrant/storage

volumes:
  friday_postgres_data:
  friday_qdrant_data: